[package]
name = "herit-attestor"
version = "0.1.0"
edition = "2021"
publish = false

# Not part of the contracts workspace: it targets wasm32-wasip2 and runs on OutLayer.
[workspace]

[[bin]]
name = "herit-attestor"
path = "src/main.rs"

[dependencies]
wit-bindgen = "0.36"
wasi-http-client = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"

[dev-dependencies]
ed25519-dalek = "2"
# End-to-end test: the real estate contract must accept what this worker signs.
herit-estate = { path = "../contracts/herit-estate" }
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
opt-level = "z"
lto = true
strip = false # the outlayer.manifest custom section must survive
