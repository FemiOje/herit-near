[package]
name = "mock-ft"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/FemiOje/herit-near"   # cargo-near embeds this in contract metadata

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

[package.metadata.near.reproducible_build]
# Values from near-sdk-rs/examples/fungible-token/ft/Cargo.toml at tag near-sdk-v5.30.1.
# The image is identified by its digest; the tag is descriptive only.
image = "sourcescan/cargo-near:0.21.1-rust-1.96.1"
image_digest = "sha256:86bd27dd489aeb2f5004a7507d3699c045ce2f59f5287e201002966040da4a7d"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
